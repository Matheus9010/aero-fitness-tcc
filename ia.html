<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PRÓ · Personal Trainer IA</title>
    <meta
      name="description"
      content="Converse livremente com o PRÓ: planilhas de treino, controle alimentar, metas, dicas e alertas de perigo."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="logo">
          <span>P</span>
          <i class="dot"></i>
        </div>
        <div class="brand">
          <p class="brand-name">PRÓ</p>
          <p class="brand-status"><i></i> online · personal ia</p>
        </div>
        <button id="new-chat" class="btn-accent">Nova conversa</button>
      </header>

      <main id="transcript" class="transcript">
        <div id="empty" class="empty">
          <div class="empty-badge">P</div>
          <h1>PRÓ · Personal Trainer IA</h1>
          <p>
            Peça uma planilha de treino, monte sua dieta, defina metas ou tire
            dúvidas. Eu te acompanho 24/7 — e aviso quando algo for perigoso.
          </p>
        </div>
      </main>

      <footer class="composer">
        <div class="composer-inner">
          <div class="quick" id="quick"></div>
          <form id="form" class="prompt">
            <textarea
              id="input"
              rows="1"
              placeholder="Escreva sua mensagem…"
              autofocus
            ></textarea>
            <div class="prompt-footer">
              <button id="send" type="submit" class="send" aria-label="Enviar">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 19V5M5 12l7-7 7 7" />
                </svg>
              </button>
            </div>
          </form>
          <p class="note" id="note">
            PRÓ treina com você 24/7 · salvamos sua conversa neste navegador
          </p>
        </div>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
