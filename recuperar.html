    <div id="form">
        <form id="formRecuperar">
            <h2 class="title">Recuperar Senha</h2>

            <label for="email">Email</label>
            <div class="input">
                <i class="fa-solid fa-envelope"></i>
                <input
                    id="email"
                    name="email"
                    placeholder="Email"
                    type="email"
                    required
                    pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                >
            </div>

            <label for="novaSenha">Nova Senha</label>
            <div class="input">
                <i class="fa-solid fa-lock"></i>
                <input
                    id="novaSenha"
                    name="novaSenha"
                    placeholder="Nova senha"
                    type="password"
                    minlength="4"
                    required
                >
                <i class="fas fa-eye toggle-senha" data-target="novaSenha" aria-label="Mostrar senha"></i>
            </div>

            <label for="confirmaSenha">Confirmar Nova Senha</label>
            <div class="input">
                <i class="fa-solid fa-lock"></i>
                <input
                    id="confirmaSenha"
                    name="confirmaSenha"
                    placeholder="Confirme a nova senha"
                    type="password"
                    minlength="4"
                    required
                >
                <i class="fas fa-eye toggle-senha" data-target="confirmaSenha" aria-label="Mostrar senha"></i>
            </div>

            <div id="btn">
                <button type="submit">Registrar Nova Senha</button>
            </div>
        </form>

    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');

        (function() {
            'use strict';

            const toolbar = document.getElementById('pojo-a11y-toolbar');
            const toggleBtn = document.querySelector('.pojo-a11y-toolbar-toggle-link');
            const resetBtn = document.querySelector('.pojo-a11y-btn-reset');
            
            let isSpeaking = false;
            let currentUtterance = null;
            const narratorBtn = document.querySelector('.pojo-a11y-btn-narrator');
            const narratorText = document.getElementById('narrator-text');

            function getMainText() {
                const form = document.getElementById('form');
                if (!form) return 'Conteúdo não encontrado.';
                return form.innerText.replace(/\s+/g, ' ').trim() || 'Conteúdo principal não disponível.';
            }

            function toggleNarrator() {
                if (!('speechSynthesis' in window)) {
                    alert('Seu navegador não oferece suporte ao narrador.');
                    return;
                }
                const speechSynthesis = window.speechSynthesis;
                if (isSpeaking) {
                    if (speechSynthesis.speaking) speechSynthesis.cancel();
                    isSpeaking = false;
                    narratorText.textContent = 'Ouvir Página';
                    narratorBtn.classList.remove('active-tool');
                    return;
                }
                const text = getMainText();
                if (!text || text.trim().length === 0) {
                    alert('Nenhum texto disponível para leitura.');
                    return;
                }
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'pt-BR';
                utterance.rate = 0.9;
                utterance.pitch = 1;
                utterance.volume = 1;
                utterance.onstart = function() {
                    isSpeaking = true;
                    narratorText.textContent = 'Parar Leitura';
                    narratorBtn.classList.add('active-tool');
                };
                utterance.onend = function() {
                    isSpeaking = false;
                    narratorText.textContent = 'Ouvir Página';
                    narratorBtn.classList.remove('active-tool');
                };
                utterance.onerror = function() {
                    isSpeaking = false;
                    narratorText.textContent = 'Ouvir Página';
                    narratorBtn.classList.remove('active-tool');
                };
                currentUtterance = utterance;
                speechSynthesis.speak(utterance);
            }

            if (narratorBtn) {
                narratorBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    toggleNarrator();
                });
            }

            if (toggleBtn) {
                toggleBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    toolbar.classList.toggle('pojo-a11y-toolbar-open');
                });
            }

            const textElements = document.querySelectorAll(
                '.title, label, input, #btn, #btn button'
            );

            textElements.forEach((element) => {
                if (!element.dataset.a11yBaseFontSize) {
                    element.dataset.a11yBaseFontSize = parseFloat(getComputedStyle(element).fontSize);
                }
            });

            let textScale = parseFloat(localStorage.getItem('pojo-text-scale')) || 1;

            function applyTextScale() {
                textElements.forEach((element) => {
                    const originalSize = parseFloat(element.dataset.a11yBaseFontSize);
                    if (!Number.isNaN(originalSize)) {
                        element.style.fontSize = `${originalSize * textScale}px`;
                    }
                });
                localStorage.setItem('pojo-text-scale', textScale.toFixed(2));
            }

            applyTextScale();

            function applyAction(action, element) {
                const body = document.body;
                switch (action) {
                    case 'resize-plus':
                        textScale = Math.min(textScale + 0.10, 2);
                        applyTextScale();
                        element.classList.add('active-tool');
                        break;
                    case 'resize-minus':
                        textScale = Math.max(textScale - 0.10, 0.7);
                        applyTextScale();
                        element.classList.add('active-tool');
                        break;
                    case 'links-underline':
                        body.classList.toggle('pojo-links-underline');
                        element.classList.toggle('active-tool');
                        break;
                    case 'readable-font':
                        body.classList.toggle('pojo-readable-font');
                        element.classList.toggle('active-tool');
                        break;
                    default:
                        break;
                }
            }

            document.querySelectorAll('.pojo-a11y-toolbar-link[data-action]').forEach(tool => {
                tool.addEventListener('click', function(e) {
                    e.preventDefault();
                    const action = this.getAttribute('data-action');
                    if (action === 'narrator') return;
                    applyAction(action, this);
                });
            });

            if (resetBtn) {
                resetBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const body = document.body;
                    if (isSpeaking && window.speechSynthesis) {
                        window.speechSynthesis.cancel();
                        isSpeaking = false;
                        if (narratorText) narratorText.textContent = 'Ouvir Página';
                        if (narratorBtn) narratorBtn.classList.remove('active-tool');
                    }
                    body.classList.remove('pojo-links-underline', 'pojo-readable-font');
                    textScale = 1;
                    localStorage.removeItem('pojo-text-scale');
                    textElements.forEach(el => el.style.fontSize = '');
                    document.querySelectorAll('.pojo-a11y-toolbar-link[data-action]').forEach(t => {
                        t.classList.remove('active-tool');
                    });
                    toolbar.classList.remove('pojo-a11y-toolbar-open');
                });
            }

            function loadSavedState() {
                textScale = parseFloat(localStorage.getItem('pojo-text-scale')) || 1;
                applyTextScale();
            }
            loadSavedState();

        })();
    </script>

    <script>
        const API_BASE = 'https://aero-chat.matheus-martins-oliveira09.workers.dev';

        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('formRecuperar');

            document.querySelectorAll('.toggle-senha').forEach(function(icone) {
                icone.addEventListener('click', function() {
                    const inputId = this.getAttribute('data-target');
                    const input = document.getElementById(inputId);
                    if (!input) return;

                    const ehSenha = input.getAttribute('type') === 'password';
                    input.setAttribute('type', ehSenha ? 'text' : 'password');

                    this.classList.toggle('fa-eye');
                    this.classList.toggle('fa-eye-slash');
                });
            });

            form.addEventListener('submit', async function(e) {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const novaSenha = document.getElementById('novaSenha').value;
                const confirmaSenha = document.getElementById('confirmaSenha').value;

                if (!email || !novaSenha || !confirmaSenha) {
                    alert('Preencha todos os campos!');
                    return;
                }

                if (novaSenha !== confirmaSenha) {
                    alert('As senhas não coincidem! Digite novamente.');
                    document.getElementById('novaSenha').value = '';
                    document.getElementById('confirmaSenha').value = '';
                    document.getElementById('novaSenha').focus();
                    return;
                }

                if (novaSenha.length < 4) {
                    alert('A senha precisa ter pelo menos 4 caracteres.');
                    return;
                }

                const submitBtn = form.querySelector('#btn button');
                const originalText = submitBtn.textContent;
                submitBtn.disabled = true;
                submitBtn.textContent = 'Enviando...';

                try {
                    const res = await fetch(API_BASE + '/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, novaSenha })
                    });

                    const data = await res.json();

                    if (!res.ok) {
                        alert(data.error || 'Erro ao alterar a senha.');
                        submitBtn.disabled = false;
                        submitBtn.textContent = originalText;
                        return;
                    }

                    console.log('[RESET] Senha atualizada para:', email);
                    alert('Senha atualizada com sucesso! Faça login com a nova senha.');
                    window.location.href = 'login02.html';

                } catch (err) {
                    alert('Erro de conexão: ' + err.message);
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                }
            });
        });
    </script>
